name: finance-erp-full

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_erp_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finance_erp}
      POSTGRES_USER: ${DB_USERNAME:-finance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finance_user} -d ${DB_DATABASE:-finance_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  redis:
    image: redis:7-alpine
    container_name: finance_erp_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: finance_erp_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - finance_network

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: finance_erp_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:7B5pC6f0Z4yWqM1hK9xL2jR8vT3nE5sY6uI4oP0aA2c=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-finance_erp}
      DB_USERNAME: ${DB_USERNAME:-finance_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance_network

  ai:
    build:
      context: ../../apps/ai
      dockerfile: Dockerfile
    container_name: finance_erp_ai
    restart: unless-stopped
    # AI port kept strictly internal to private finance_network (P0-02)
    environment:
      ENVIRONMENT: production
      LLM_PROVIDER: mock
      APP_PORT: 8001
    networks:
      - finance_network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: finance_erp_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    networks:
      - finance_network

  nginx:
    image: nginx:alpine
    container_name: finance_erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - finance_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  finance_network:
    driver: bridge
