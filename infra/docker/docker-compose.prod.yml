name: finance-erp-prod

services:
  # ── 1. Edge Ingress: HTTP reverse proxy; TLS must terminate at a trusted external ingress ─
  nginx:
    image: nginx:1.27-alpine
    container_name: finance_prod_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - finance_prod_network

  # ── 2. Storage & Cache Infrastructure (Internal Network Only) ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: finance_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finance_erp}
      POSTGRES_USER: ${DB_USERNAME:-finance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finance_user} -d ${DB_DATABASE:-finance_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - finance_prod_network

  redis:
    image: redis:7-alpine
    container_name: finance_prod_redis
    restart: always
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - finance_prod_network

  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: finance_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be provided in production}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be provided in production}
    command: server /data
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - finance_prod_network

  # ── 3. Application API: Production PHP-FPM FastCGI Daemon ───────────────────
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: finance_prod_api
    restart: always
    # Security: Internal PHP-FPM port 9000 is routed only through Nginx
    expose:
      - "9000"
    volumes:
      - backup_prod_data:/var/www/html/storage/app/backups
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be provided in production}
      CONTROL_CENTER_STAFF_EMAILS: ${CONTROL_CENTER_STAFF_EMAILS:?CONTROL_CENTER_STAFF_EMAILS must be provisioned in production}
      CONTROL_CENTER_STAFF_ROLES: ${CONTROL_CENTER_STAFF_ROLES:?CONTROL_CENTER_STAFF_ROLES must be provisioned in production}
      OPS_ALLOWED_HOSTS: ${OPS_ALLOWED_HOSTS:?OPS_ALLOWED_HOSTS must name the dedicated staff portal host}
      OPS_PORTAL_URL: ${OPS_PORTAL_URL:?OPS_PORTAL_URL must use the dedicated staff portal host}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_URL: ${APP_URL:?APP_URL must be provided in production}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be provided in production}
      MAIL_MAILER: ${MAIL_MAILER:?MAIL_MAILER must be provided in production}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtps}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS must be provided in production}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Finance ERP}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-finance_erp}
      DB_USERNAME: ${DB_USERNAME:-finance_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be provided in production}
      BACKUP_REMOTE_DISK: backups
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:?BACKUP_S3_KEY must be provided for off-host backups}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:?BACKUP_S3_SECRET must be provided for off-host backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET must be provided for off-host backups}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_USE_PATH_STYLE_ENDPOINT: ${BACKUP_S3_USE_PATH_STYLE_ENDPOINT:-false}
      BACKUP_RESTORE_DB_HOST: ${BACKUP_RESTORE_DB_HOST:-postgres}
      BACKUP_RESTORE_DB_PORT: ${BACKUP_RESTORE_DB_PORT:-5432}
      BACKUP_RESTORE_DB_USERNAME: ${BACKUP_RESTORE_DB_USERNAME:?BACKUP_RESTORE_DB_USERNAME must be provided for restore drills}
      BACKUP_RESTORE_DB_PASSWORD: ${BACKUP_RESTORE_DB_PASSWORD:?BACKUP_RESTORE_DB_PASSWORD must be provided for restore drills}
      BACKUP_RESTORE_DB_MAINTENANCE_DATABASE: ${BACKUP_RESTORE_DB_MAINTENANCE_DATABASE:-postgres}
      SESSION_SECURE_COOKIE: "true"
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAINS:-localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - finance_prod_network

  # ── 4. Dedicated Background Processing: Laravel Queue Worker ────────────────
  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: finance_prod_worker
    restart: always
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90", "--sleep=3", "--max-time=3600"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be provided in production}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-finance_erp}
      DB_USERNAME: ${DB_USERNAME:-finance_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be provided in production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - finance_prod_network

  # ── 5. Dedicated Recurring Job Automation: Laravel Scheduler ────────────────
  scheduler:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: finance_prod_scheduler
    restart: always
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - backup_prod_data:/var/www/html/storage/app/backups
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be provided in production}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-finance_erp}
      DB_USERNAME: ${DB_USERNAME:-finance_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided in production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_SERVICE_URL: http://ai:8001
      AI_INTERNAL_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be provided in production}
      BACKUP_REMOTE_DISK: backups
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:?BACKUP_S3_KEY must be provided for off-host backups}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:?BACKUP_S3_SECRET must be provided for off-host backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET must be provided for off-host backups}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_USE_PATH_STYLE_ENDPOINT: ${BACKUP_S3_USE_PATH_STYLE_ENDPOINT:-false}
      BACKUP_RESTORE_DB_HOST: ${BACKUP_RESTORE_DB_HOST:-postgres}
      BACKUP_RESTORE_DB_PORT: ${BACKUP_RESTORE_DB_PORT:-5432}
      BACKUP_RESTORE_DB_USERNAME: ${BACKUP_RESTORE_DB_USERNAME:?BACKUP_RESTORE_DB_USERNAME must be provided for restore drills}
      BACKUP_RESTORE_DB_PASSWORD: ${BACKUP_RESTORE_DB_PASSWORD:?BACKUP_RESTORE_DB_PASSWORD must be provided for restore drills}
      BACKUP_RESTORE_DB_MAINTENANCE_DATABASE: ${BACKUP_RESTORE_DB_MAINTENANCE_DATABASE:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - finance_prod_network

  # ── 6. Internal AI Microservice: FastAPI Service (No Public Port Exposure) ──
  ai:
    build:
      context: ../../apps/ai
      dockerfile: Dockerfile
    container_name: finance_prod_ai
    restart: always
    # Security: AI port 8001 is NEVER exposed to the public internet / host.
    # Accessible strictly by api, worker, and scheduler on the internal bridge network.
    expose:
      - "8001"
    environment:
      ENVIRONMENT: production
      DEFAULT_LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER must be configured in production (e.g. gemini, openai, anthropic)}
      APP_PORT: 8001
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be provided in production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - finance_prod_network

  # ── 7. Next.js Web Frontend (Served Behind Nginx Reverse Proxy) ─────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: finance_prod_web
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      INTERNAL_API_URL: http://nginx/api/v1
      OPS_ALLOWED_HOSTS: ${OPS_ALLOWED_HOSTS:?OPS_ALLOWED_HOSTS must name the dedicated staff portal host}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - finance_prod_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  backup_prod_data:

networks:
  finance_prod_network:
    driver: bridge
